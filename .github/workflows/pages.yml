name: build and deploy to github pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    if: github.repository != 'lachlan-waugh/tut-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: get hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.155.0'
          extended: true

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: build slides
        working-directory: slides
        run: hugo --gc --minify --cleanDestinationDir -d public


      - name: prepare staging
        run: |
          mkdir out
          mv slides/public/* out/
          mkdir -p out/demos name:dd build demos

      - name: build demos
        run: |
          # Debug: List the directory to ensure we see the folders
          echo "Checking directory structure..."
          ls -R

          for demo in cookie shop waf; do
            echo "--------------------------"
            echo "Building demo: $demo"

            # Using ( ) creates a subshell so we don't get lost in directories
            (
              cd demos/lectures/sqli/$demo || { echo "Directory $demo not found"; exit 1; }
              bun install
              bun run build

              # Ensure the target directory exists in our 'out' folder
              mkdir -p ../../../../out/demos/$demo

              # Copy build output. Adjust 'dist' if your build folder is named 'build' or '.output'
              cp -r dist/* ../../../../out/demos/$demo/
            )
          done

      - name: deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ./slides/public
          enable_jekyll: true
