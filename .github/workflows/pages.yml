name: build and deploy to github pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    if: github.repository != 'lachlan-waugh/tut-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: get hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.155.0'
          extended: true

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: build slides
        working-directory: slides
        run: hugo --gc --minify --cleanDestinationDir -d public


      - name: prepare staging
        run: |
          mkdir -p out/demos
          mv slides/public/* out/
          rm out/index.html

      - name: build demos
        run: |
          OUT_DIR=$(pwd)/out
          for demo in cookie shop waf; do
            cd demos/lecture/sqli/$demo
            bun install
            bun run build --base=./
            mkdir -p $OUT_DIR/demos/$demo
            cp -r dist/* $OUT_DIR/demos/$demo/
            cd $GITHUB_WORKSPACE
          done

      - name: deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ./out
          enable_jekyll: true
