name: build and deploy to github pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    if: github.repository != 'lachlan-waugh/tut-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: get hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.155.0'
          extended: true

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: build slides
        working-directory: slides
        run: hugo --gc --minify --cleanDestinationDir -d public


      - name: prepare staging
        run: |
          mkdir -p out
          mv slides/public/* out/
          rm out/index.html
          mkdir -p out/demos name:dd build demos

      - name: build demos
        run: |
          for demo in cookie shop waf; do
            echo "Building demo: $demo"
            cd demos/lecture/sqli/$demo
            bun install
            bun run build --base=/6443/demos/$demo/
            # Ensure the target directory exists in our staging area
            mkdir -p ../../../../out/demos/$demo
            # Move the build output (assuming 'dist' or 'build') to staging
            # Check your specific framework's output folder (usually 'dist' or 'build')
            cp -r dist/* ../../../../out/demos/$demo/
            cd ../../../../
          done

      - name: deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ./out
          enable_jekyll: true
